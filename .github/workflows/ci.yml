name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 bankguard/tests/test_agent_guard.py
      - run: python3 bankguard/scripts/scan_for_finance_leak.py
      - run: python3 humangate/tests/test_human_gate.py
      - run: python3 humangate_blocker/tests/test_120_attacks.py
